name: Tests

on:
  push:
    branches: [main, "v2*"]
  pull_request:
    branches: [main, "v2*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) no longer ships Python 3.9
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    env:
      CI: true
      PYTHONUTF8: "1"  # Windows runners default to cp1252; tests print UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI (editable, with YAML capability)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit / contract / wiring / migration tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build drift gate (src/ vs plugins/ + template/ + marketplace)
        run: python scripts/build.py --check

      - name: CLI + offline end-to-end demo
        run: |
          dw --version
          python scripts/run_demo.py

      - name: Doctor smoke (repo checkout resolves to plugin mode; must pass)
        run: dw doctor

      - name: Exercise clean wheel installation
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/check_wheel_install.py dist/dw_harness-*-py3-none-any.whl
