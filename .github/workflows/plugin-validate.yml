name: Plugin validate (trusted env)

# Requires the Claude Code CLI and an authenticated account.
# Run manually (workflow_dispatch); skipped gracefully when claude is absent.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install claude-cli presence check
        id: claude
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            claude --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "claude CLI not present on runner; skipping live validation"
          fi

      - name: Load plugin from local dir (headless, must succeed)
        if: steps.claude.outputs.available == 'true'
        run: |
          claude -p "reply with the word ok" --plugin-dir ./plugins/dw-harness

      - name: Marketplace add + manifest validation (must succeed)
        if: steps.claude.outputs.available == 'true'
        run: |
          claude plugin marketplace add .
          claude plugin validate ./plugins/dw-harness

      - name: Trigger write-after feedback (headless wiring check)
        if: steps.claude.outputs.available == 'true'
        run: |
          claude -p "write the file bad_star.sql with exactly: SELECT t.* FROM db.t; then stop" \
            --plugin-dir ./plugins/dw-harness
          # the PostToolUse hook must have flagged no-select-star in the transcript;
          # manual verification step documented in docs/e2e-demo.md

      - name: Plugin eval (optional, account-scoped)
        if: steps.claude.outputs.available == 'true'
        run: claude plugin eval dw-harness || true
